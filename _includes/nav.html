{%- assign nav_lang = page.lang | default: "en" -%}
{%- assign nt = site.data.i18n[nav_lang] -%}
<nav class="site-nav">
  <div class="site-nav-inner container is-max-desktop">
    <a class="site-nav-brand" href="{{ nt.home_url | relative_url }}">{{ nt.brand }}</a>
    <div class="site-nav-links">
      <a href="{{ nt.home_url | relative_url }}"{% if include.active == 'home' %} class="is-active"{% endif %}>{{ nt.nav_home }}</a>
      <a href="{{ '/files/Research.pdf' | relative_url }}" target="_blank" rel="noopener">{{ nt.nav_research }}</a>
      <a href="{{ '/cv.html' | relative_url }}"{% if include.active == 'cv' %} class="is-active"{% endif %}>{{ nt.nav_cv }}</a>
      <a class="site-nav-lang" href="{{ nt.other_url | relative_url }}" hreflang="{{ nt.other_lang }}" lang="{{ nt.other_lang }}"
         title="{{ nt.switch_title }}" onclick="try{localStorage.setItem('site_lang','{{ nt.other_lang }}')}catch(e){}">{{ nt.switch_label }}</a>
    </div>
  </div>
</nav>
