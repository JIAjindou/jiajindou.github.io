  bio: |-
    我目前是南洋理工大学（NTU）[MARS](http://marslab.tech) 实验室的博士后，合作导师为[杨剑飞](https://marsyang.site/)教授。2025 年博士毕业于北京航空航天大学沈元荣誉学院，师从[郭雷](https://scholar.google.com/citations?user=IxO-SDwAAAAJ&hl=zh-CN)院士、[余翔](https://scholar.google.com/citations?user=6UgtuZ8AAAAJ&hl=zh-CN&oi=ao)教授和[郭克信](https://scholar.google.com/citations?hl=zh-CN&user=c0MaejIAAAAJ)教授。

    我的研究方向是可泛化的机器人学习：将**世界模型**、**生成式策略**和**不确定性预测**与物理先验相结合，让机器人能够从训练环境可靠地迁移到从未见过的新环境中。
