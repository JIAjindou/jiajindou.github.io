---
layout: null
---
<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
  {% include visit-ping.html %}
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>Visitors | Jindou Jia</title>

  <meta name="description" content="A live, privacy-friendly map of visitors to Jindou Jia's homepage.">
  <meta name="author" content="Jindou Jia">

  <link href="{{ '/css/fonts.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/css/academicons.min.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/css/icons.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/css/bulma.min.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/css/index.css' | relative_url }}?v={{ site.time | date: '%s' }}" rel="stylesheet">

  <link rel="icon" href="images/ICON.png" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/images/ICON.png' | relative_url }}">

  <script src="{{ '/js/jquery.min.js' | relative_url }}"></script>
  <script src="{{ '/js/index.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

  {% if site.goatcounter %}
  <script>
    // GoatCounter's gc.zgo.at is unreachable from mainland China. Load it only
    // after the page has finished loading so a hung request never holds it up.
    window.addEventListener('load', function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://gc.zgo.at/count.js';
      s.setAttribute('data-goatcounter', 'https://{{ site.goatcounter }}.goatcounter.com/count');
      document.body.appendChild(s);
    });
  </script>
  {% endif %}
</head>

<body data-globe-page="1">

  {% include nav.html active="visitors" %}

  <section class="section">
    <div class="container is-max-desktop has-text-centered">
      <h2 class="title is-3">Where my visitors come from</h2>
      <p class="visitors-intro">A live, privacy-friendly map — city-level locations only, no IP or personal data.</p>

      <div class="visitor-globe-page">
        <button type="button" id="globe-toggle" class="globe-toggle" aria-expanded="false" hidden>🌍 Show</button>
        <div id="globe-box" class="globe-box globe-box-lg"></div>
        <div id="globe-stats" class="globe-stats"></div>
      </div>
    </div>
  </section>

</body>

</html>
